<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>プレミア漫画 コレクション管理（デモ）</title>
<style>
  :root{
    --bg:#0f1115; --panel:#181b22; --panel2:#1f232c; --line:#2a2f3a;
    --text:#e7e9ee; --muted:#9aa3b2; --accent:#e0245e; --accent2:#3a8bff;
    --plus:#34c759; --minus:#ff453a; --radius:12px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic UI",Meiryo,sans-serif;}
  header{position:sticky;top:0;z-index:20;background:rgba(15,17,21,.9);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 20px;
    display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  h1{font-size:18px;margin:0;letter-spacing:.02em}
  h1 small{color:var(--muted);font-weight:400;font-size:12px;margin-left:8px}
  .grow{flex:1}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel2);
    color:var(--text);padding:8px 14px;border-radius:8px;transition:.15s}
  button:hover{border-color:#3a4150;background:#262b35}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover{filter:brightness(1.1)}
  button.ghost{background:transparent}
  input,select,textarea{font:inherit;background:var(--panel2);border:1px solid var(--line);
    color:var(--text);padding:9px 11px;border-radius:8px;width:100%}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent2)}
  label.field{display:block;font-size:12px;color:var(--muted);margin:0 0 5px}
  .wrap{max-width:1200px;margin:0 auto;padding:20px}

  /* summary cards */
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:20px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
  .card .k{font-size:12px;color:var(--muted)}
  .card .v{font-size:22px;font-weight:700;margin-top:6px}
  .plus{color:var(--plus)} .minus{color:var(--minus)}

  /* toolbar */
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
  .toolbar .search{flex:1;min-width:200px}
  .toolbar select{width:auto}

  /* grid */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
  .item{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;display:flex;flex-direction:column}
  .item .thumb{aspect-ratio:3/4;background:#0c0e12;display:flex;align-items:center;justify-content:center;
    overflow:hidden;position:relative}
  .item .thumb img{width:100%;height:100%;object-fit:cover}
  .item .thumb .ph{color:#3a4150;font-size:42px}
  .badges{position:absolute;top:8px;left:8px;display:flex;gap:5px;flex-wrap:wrap}
  .badge{font-size:10px;padding:3px 7px;border-radius:20px;background:rgba(0,0,0,.6);
    border:1px solid var(--line);color:#fff}
  .badge.hot{background:var(--accent);border-color:var(--accent)}
  .item .body{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}
  .item .title{font-weight:700;font-size:15px;line-height:1.3}
  .item .meta{font-size:12px;color:var(--muted)}
  .item .nums{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;
    border-top:1px solid var(--line);padding-top:10px}
  .item .market{font-size:18px;font-weight:700}
  .item .pl{font-size:12px;text-align:right}
  .item .acts{display:flex;gap:6px;padding:0 12px 12px}
  .item .acts button{flex:1;padding:6px;font-size:13px}

  .empty{text-align:center;color:var(--muted);padding:60px 20px;border:1px dashed var(--line);
    border-radius:var(--radius)}

  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-start;
    justify-content:center;padding:30px 16px;z-index:50;overflow:auto}
  .overlay.open{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;
    width:100%;max-width:680px;padding:22px}
  .modal h2{margin:0 0 18px;font-size:18px}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .form-grid .full{grid-column:1/-1}
  .row-checks{display:flex;gap:18px;flex-wrap:wrap;align-items:center}
  .row-checks label{display:flex;gap:7px;align-items:center;font-size:13px;color:var(--text);cursor:pointer}
  .row-checks input{width:auto}
  .modal-actions{display:flex;justify-content:space-between;gap:10px;margin-top:22px}
  .thumb-preview{width:90px;aspect-ratio:3/4;border-radius:8px;object-fit:cover;border:1px solid var(--line);background:#0c0e12}
  @media(max-width:560px){.form-grid{grid-template-columns:1fr}}
  .hint{font-size:11px;color:var(--muted);margin-top:4px}

  /* tabs */
  .tabs{display:flex;gap:4px;background:var(--panel2);padding:4px;border-radius:10px}
  .tab{background:transparent;border:none;color:var(--muted);padding:7px 16px;border-radius:7px}
  .tab:hover{background:transparent;color:var(--text)}
  .tab.active{background:var(--accent);color:#fff}

  /* market chart on card */
  .spark{width:100%;height:54px;display:block}
  .trend{font-size:12px;font-weight:700}
  .item .seller{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px}
  .item .seller .ava{width:18px;height:18px;border-radius:50%;display:inline-flex;
    align-items:center;justify-content:center;font-size:10px;background:var(--panel2);border:1px solid var(--line)}

  /* market detail */
  #mkModal .mk-head{display:flex;gap:16px;margin-bottom:18px}
  #mkModal .mk-head .pic{width:120px;aspect-ratio:3/4;border-radius:10px;background:#0c0e12;
    display:flex;align-items:center;justify-content:center;font-size:40px;color:#3a4150;border:1px solid var(--line);flex-shrink:0}
  #mkModal .price-now{font-size:30px;font-weight:800}
  #mkModal .chartbox{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:16px;margin:6px 0 16px}
  #mkModal .bigchart{width:100%;height:200px;display:block}
  #mkModal .stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:8px}
  #mkModal .stat{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  #mkModal .stat .k{font-size:11px;color:var(--muted)}
  #mkModal .stat .v{font-size:16px;font-weight:700;margin-top:3px}
  .chip{display:inline-block;font-size:11px;padding:3px 9px;border-radius:20px;border:1px solid var(--line);margin-right:5px}
  .chip.hot{background:var(--accent);border-color:var(--accent);color:#fff}
</style>
</head>
<body>
<header>
  <h1>📚 プレミア漫画 <small>デモ版</small></h1>
  <nav class="tabs">
    <button class="tab active" data-view="collection">マイコレクション</button>
    <button class="tab" data-view="market">マーケット</button>
  </nav>
  <div class="grow"></div>
  <div id="collectionActions" style="display:flex;gap:10px">
    <button class="ghost" id="btnExport">バックアップ書出し</button>
    <button class="ghost" id="btnImport">読込み</button>
    <input type="file" id="fileImport" accept="application/json" hidden>
    <button class="primary" id="btnAdd">＋ 作品を登録</button>
  </div>
</header>

<div class="wrap" id="view-collection">
  <!-- summary -->
  <div class="cards">
    <div class="card"><div class="k">登録点数</div><div class="v" id="sumCount">0</div></div>
    <div class="card"><div class="k">総取得額</div><div class="v" id="sumCost">¥0</div></div>
    <div class="card"><div class="k">現在評価額</div><div class="v" id="sumValue">¥0</div></div>
    <div class="card"><div class="k">含み損益</div><div class="v" id="sumPL">¥0</div></div>
  </div>

  <!-- toolbar -->
  <div class="toolbar">
    <div class="search"><input type="text" id="search" placeholder="🔍 タイトル・著者・出版社で検索"></div>
    <select id="filter">
      <option value="">すべて表示</option>
      <option value="firstEd">初版のみ</option>
      <option value="obi">帯付きのみ</option>
      <option value="special">特装・サイン本のみ</option>
      <option value="profit">含み益のあるもの</option>
      <option value="loss">含み損のあるもの</option>
    </select>
    <select id="sort">
      <option value="updated">更新が新しい順</option>
      <option value="marketDesc">相場が高い順</option>
      <option value="plDesc">損益が大きい順</option>
      <option value="titleAsc">タイトル順</option>
    </select>
  </div>

  <div id="grid" class="grid"></div>
  <div id="empty" class="empty" style="display:none">
    まだ作品が登録されていません。右上の「＋ 作品を登録」から追加してください。
  </div>
</div>

<!-- ============ MARKET VIEW ============ -->
<div class="wrap" id="view-market" style="display:none">
  <div class="cards">
    <div class="card"><div class="k">出品数</div><div class="v" id="mkCount">0</div></div>
    <div class="card"><div class="k">最高額の出品</div><div class="v" id="mkTop">¥0</div></div>
    <div class="card"><div class="k">平均出品価格</div><div class="v" id="mkAvg">¥0</div></div>
    <div class="card"><div class="k">直近30日の値上がり率(平均)</div><div class="v" id="mkTrend">—</div></div>
  </div>

  <div class="toolbar">
    <div class="search"><input type="text" id="mkSearch" placeholder="🔍 出品を検索（タイトル・著者・出品者）"></div>
    <select id="mkSort">
      <option value="priceDesc">価格が高い順</option>
      <option value="trendDesc">値上がり率が高い順</option>
      <option value="newest">新着順</option>
    </select>
  </div>

  <div id="mkGrid" class="grid"></div>
</div>

<!-- modal -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modalTitle">作品を登録</h2>
    <input type="hidden" id="f_id">
    <div class="form-grid">
      <div class="full">
        <label class="field">タイトル＊</label>
        <input id="f_title" placeholder="例）AKIRA 全6巻 初版帯付セット">
      </div>
      <div>
        <label class="field">著者</label>
        <input id="f_author" placeholder="大友克洋">
      </div>
      <div>
        <label class="field">出版社 / レーベル</label>
        <input id="f_publisher" placeholder="講談社 / KCデラックス">
      </div>
      <div>
        <label class="field">巻数 / セット</label>
        <input id="f_volume" placeholder="全6巻 / 第1巻 など">
      </div>
      <div>
        <label class="field">発行年</label>
        <input id="f_year" placeholder="1984">
      </div>
      <div>
        <label class="field">コンディション</label>
        <select id="f_condition">
          <option>S（新品・美品）</option>
          <option selected>A（良い）</option>
          <option>B（並）</option>
          <option>C（傷み・難あり）</option>
        </select>
      </div>
      <div>
        <label class="field">所有数</label>
        <input id="f_qty" type="number" min="1" value="1">
      </div>
      <div>
        <label class="field">取得価格（1点）</label>
        <input id="f_cost" type="number" min="0" placeholder="3000">
      </div>
      <div>
        <label class="field">現在相場（1点）</label>
        <input id="f_market" type="number" min="0" placeholder="12000">
      </div>
      <div>
        <label class="field">購入日</label>
        <input id="f_date" type="date">
      </div>
      <div>
        <label class="field">購入店舗 / 経路</label>
        <input id="f_store" placeholder="まんだらけ / メルカリ など">
      </div>
      <div>
        <label class="field">保管場所</label>
        <input id="f_location" placeholder="本棚A / 防湿庫 など">
      </div>
      <div class="full">
        <label class="field">状態フラグ</label>
        <div class="row-checks">
          <label><input type="checkbox" id="f_firstEd"> 初版</label>
          <label><input type="checkbox" id="f_obi"> 帯付き</label>
          <label><input type="checkbox" id="f_special"> 特装版 / サイン本</label>
        </div>
      </div>
      <div class="full">
        <label class="field">写真</label>
        <div style="display:flex;gap:14px;align-items:center">
          <img id="f_imgPreview" class="thumb-preview" alt="">
          <div style="flex:1">
            <input type="file" id="f_image" accept="image/*">
            <div class="hint">画像はブラウザ内に保存されます。容量節約のため自動で縮小されます。</div>
            <button type="button" class="ghost" id="f_imgClear" style="margin-top:8px">写真を削除</button>
          </div>
        </div>
      </div>
      <div class="full">
        <label class="field">メモ</label>
        <textarea id="f_memo" rows="2" placeholder="傷の場所、付属物、購入時のメモなど"></textarea>
      </div>
    </div>
    <div class="modal-actions">
      <button class="ghost" id="btnDelete" style="color:var(--minus);border-color:var(--minus);display:none">削除</button>
      <div class="grow"></div>
      <button class="ghost" id="btnCancel">キャンセル</button>
      <button class="primary" id="btnSave">保存</button>
    </div>
  </div>
</div>

<!-- market detail modal -->
<div class="overlay" id="mkOverlay">
  <div class="modal" id="mkModal" style="max-width:720px"></div>
</div>

<script>
const STORAGE_KEY = 'premium-manga-collection-v1';
const yen = n => '¥' + Math.round(n||0).toLocaleString('ja-JP');
const $ = id => document.getElementById(id);

const SEED = [
  {title:'AKIRA 全6巻 初版帯付セット', author:'大友克洋', publisher:'講談社 / KCデラックス', volume:'全6巻', year:'1984',
   condition:'A（良い）', qty:1, cost:8000, market:35000, store:'まんだらけ', location:'本棚A', firstEd:true, obi:true, special:false,
   memo:'初版・帯揃い。背ヤケ少なめ。'},
  {title:'ドラゴンボール 完全版 全34巻', author:'鳥山明', publisher:'集英社 / ジャンプコミックス', volume:'全34巻', year:'2002',
   condition:'S（新品・美品）', qty:1, cost:25000, market:42000, store:'駿河屋', location:'本棚A', firstEd:false, obi:false, special:false,
   memo:'完全版フルセット。状態良好。'},
  {title:'ジョジョの奇妙な冒険 第1巻 初版', author:'荒木飛呂彦', publisher:'集英社 / ジャンプコミックス', volume:'第1巻', year:'1987',
   condition:'B（並）', qty:1, cost:3000, market:18000, store:'メルカリ', location:'防湿庫', firstEd:true, obi:false, special:false,
   memo:'1巻のみ。角に小スレ。'},
  {title:'寄生獣 全10巻', author:'岩明均', publisher:'講談社 / アフタヌーンKC', volume:'全10巻', year:'1990',
   condition:'A（良い）', qty:1, cost:4500, market:6000, store:'BOOKOFF', location:'本棚B', firstEd:false, obi:false, special:false, memo:''},
  {title:'鬼滅の刃 第1巻 初版', author:'吾峠呼世晴', publisher:'集英社 / ジャンプコミックス', volume:'第1巻', year:'2016',
   condition:'S（新品・美品）', qty:2, cost:1500, market:9000, store:'ヤフオク', location:'防湿庫', firstEd:true, obi:true, special:false,
   memo:'初版帯付き2冊保有。値上がり中。'},
  {title:'ベルセルク 第1巻 初版', author:'三浦建太郎', publisher:'白泉社 / ジェッツコミックス', volume:'第1巻', year:'1990',
   condition:'B（並）', qty:1, cost:5000, market:14000, store:'まんだらけ', location:'防湿庫', firstEd:true, obi:false, special:false,
   memo:'初版。日焼けあり。'},
  {title:'SLAM DUNK 新装再編版 全20巻', author:'井上雄彦', publisher:'集英社', volume:'全20巻', year:'2018',
   condition:'S（新品・美品）', qty:1, cost:13000, market:15000, store:'Amazon', location:'本棚A', firstEd:false, obi:true, special:false, memo:''},
  {title:'幽☆遊☆白書 直筆サイン入り 第1巻', author:'冨樫義博', publisher:'集英社 / ジャンプコミックス', volume:'第1巻', year:'1991',
   condition:'A（良い）', qty:1, cost:20000, market:55000, store:'即売会', location:'防湿庫', firstEd:true, obi:true, special:true,
   memo:'本人直筆サイン入り。証明書あり。'}
].map((x,i)=>({ id:'seed'+i, date:'', updated:Date.now()-i*1000, image:'', ...x }));

let items = load();

function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw===null){ return SEED; }          // 初回はサンプルを投入
    return JSON.parse(raw) || [];
  }
  catch(e){ return []; }
}
function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(items)); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

/* ---------- rendering ---------- */
function render(){
  const q = $('search').value.trim().toLowerCase();
  const filter = $('filter').value;
  const sort = $('sort').value;

  let list = items.filter(it=>{
    if(q){
      const hay = (it.title+' '+it.author+' '+it.publisher).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    const pl = (it.market - it.cost) * it.qty;
    if(filter==='firstEd' && !it.firstEd) return false;
    if(filter==='obi' && !it.obi) return false;
    if(filter==='special' && !it.special) return false;
    if(filter==='profit' && pl<=0) return false;
    if(filter==='loss' && pl>=0) return false;
    return true;
  });

  list.sort((a,b)=>{
    if(sort==='marketDesc') return b.market - a.market;
    if(sort==='plDesc') return ((b.market-b.cost)*b.qty) - ((a.market-a.cost)*a.qty);
    if(sort==='titleAsc') return a.title.localeCompare(b.title,'ja');
    return (b.updated||0) - (a.updated||0);
  });

  const grid = $('grid');
  grid.innerHTML = '';
  $('empty').style.display = items.length===0 ? 'block' : 'none';

  for(const it of list){
    const pl = (it.market - it.cost) * it.qty;
    const plCls = pl>0?'plus':(pl<0?'minus':'');
    const sign = pl>0?'+':'';
    const el = document.createElement('div');
    el.className = 'item';
    el.innerHTML = `
      <div class="thumb">
        ${it.image ? `<img src="${it.image}" alt="">` : `<span class="ph">📖</span>`}
        <div class="badges">
          ${it.firstEd?'<span class="badge hot">初版</span>':''}
          ${it.obi?'<span class="badge">帯</span>':''}
          ${it.special?'<span class="badge">特装</span>':''}
        </div>
      </div>
      <div class="body">
        <div class="title"></div>
        <div class="meta"></div>
        <div class="meta meta2"></div>
        <div class="nums">
          <div>
            <div class="meta">現在相場</div>
            <div class="market">${yen(it.market)}</div>
          </div>
          <div class="pl ${plCls}">${sign}${yen(pl)}<br><span class="meta">${it.qty}点 / 取得 ${yen(it.cost)}</span></div>
        </div>
      </div>
      <div class="acts">
        <button data-edit="${it.id}">編集</button>
      </div>`;
    el.querySelector('.title').textContent = it.title;
    el.querySelector('.meta').textContent = [it.author, it.volume].filter(Boolean).join(' ・ ') || '—';
    el.querySelector('.meta2').textContent = [it.publisher, it.condition, it.year].filter(Boolean).join(' ・ ');
    grid.appendChild(el);
  }
  grid.querySelectorAll('[data-edit]').forEach(b=>{
    b.onclick = ()=> openModal(b.dataset.edit);
  });

  renderSummary();
}

function renderSummary(){
  let cost=0, value=0;
  for(const it of items){ cost += it.cost*it.qty; value += it.market*it.qty; }
  const pl = value - cost;
  $('sumCount').textContent = items.reduce((s,it)=>s+Number(it.qty||0),0);
  $('sumCost').textContent = yen(cost);
  $('sumValue').textContent = yen(value);
  const plEl = $('sumPL');
  plEl.textContent = (pl>0?'+':'') + yen(pl);
  plEl.className = 'v ' + (pl>0?'plus':(pl<0?'minus':''));
}

/* ---------- modal ---------- */
let tempImage = '';

function openModal(id){
  const editing = !!id;
  $('modalTitle').textContent = editing ? '作品を編集' : '作品を登録';
  $('btnDelete').style.display = editing ? 'inline-block' : 'none';
  const it = editing ? items.find(x=>x.id===id) : null;
  $('f_id').value = id || '';
  $('f_title').value = it?.title||'';
  $('f_author').value = it?.author||'';
  $('f_publisher').value = it?.publisher||'';
  $('f_volume').value = it?.volume||'';
  $('f_year').value = it?.year||'';
  $('f_condition').value = it?.condition||'A（良い）';
  $('f_qty').value = it?.qty||1;
  $('f_cost').value = it?.cost ?? '';
  $('f_market').value = it?.market ?? '';
  $('f_date').value = it?.date||'';
  $('f_store').value = it?.store||'';
  $('f_location').value = it?.location||'';

  $('f_obi').checked = !!it?.obi;

function closeModal(){ $('overlay').classList.remove('open'); }

function updatePreview(){
  const img = $('f_imgPreview');
  if(tempImage){ img.src = tempImage; img.style.display='block'; }
  else { img.removeAttribute('src'); img.style.display='none'; }
}

function collect(){
  return {
    id: $('f_id').value || uid(),
    title: $('f_title').value.trim(),
    author: $('f_author').value.trim(),
    publisher: $('f_publisher').value.trim(),
    volume: $('f_volume').value.trim(),
    year: $('f_year').value.trim(),
    condition: $('f_condition').value,

/* image resize -> dataURL */
function handleImage(file){
  const reader = new FileReader();
  reader.onload = e=>{
    const img = new Image();
    img.onload = ()=>{
      const max = 600;
      let {width:w, height:h} = img;
      if(w>max||h>max){ const r=Math.min(max/w,max/h); w=w*r; h=h*r; }
      const c = document.createElement('canvas');
      c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      tempImage = c.toDataURL('image/jpeg', 0.8);
      updatePreview();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

$('btnExport').onclick = ()=>{

      const data = JSON.parse(ev.target.result);

// 価格推移をそれっぽく生成（基準価格・トレンド・ぶれ から12点）
function genHistory(base, trend, vol){
  const pts=[]; let p = base;
  for(let i=0;i<12;i++){
    const drift = base * trend * (i/11);          // 緩やかな上昇/下降
    const noise = base * vol * (Math.random()-0.5);
    pts.push(Math.max(500, Math.round((base + drift + noise)/100)*100));
  }
  // 最後の点を「現在価格」として整える
  pts[11] = Math.max(500, Math.round((base*(1+trend))/100)*100);
  return pts;
}

  return { id:'mk'+i, ...x, hist, price, change, listedAt: i };

function pct(n){ const s=(n*100); return (s>=0?'+':'')+s.toFixed(1)+'%'; }

// SVG折れ線。col=線色。size: 'spark' or 'big'
function svgLine(data, w, h, opts={}){
  const min = Math.min(...data), max = Math.max(...data);
  const pad = opts.pad||4;
  const rng = (max-min)||1;
  const X = i => pad + i*(w-2*pad)/(data.length-1);
  const Y = v => h-pad - ((v-min)/rng)*(h-2*pad);
  const pts = data.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
  const up = data[data.length-1] >= data[0];
  const col = up ? '#34c759' : '#ff453a';
  const area = `${X(0)},${h-pad} ${pts} ${X(data.length-1)},${h-pad}`;
  let dots = '';
  if(opts.dots){
    dots = data.map((v,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="2.5" fill="${col}"/>`).join('');
  }
  let labels='';
  if(opts.labels){
    labels = MONTHS.map((m,i)=> (i%2===0 || i===11) ?
      `<text x="${X(i).toFixed(1)}" y="${h-2}" font-size="9" fill="#9aa3b2" text-anchor="middle">${m}</text>`:'').join('');
  }
  return `<svg class="${opts.cls||''}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <defs><linearGradient id="g${opts.gid||0}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${col}" stop-opacity="0.28"/>
      <stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
    <polygon points="${area}" fill="url(#g${opts.gid||0})"/>
    <polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}${labels}</svg>`;
}

function avatarHue(name){ let h=0; for(const c of name) h=(h*31+c.charCodeAt(0))%360; return h; }

function renderMarket(){
  const q = $('mkSearch').value.trim().toLowerCase();
  const sort = $('mkSort').value;
  let list = MARKET.filter(m=>{
    if(!q) return true;
    return (m.t+' '+m.a+' '+m.seller).toLowerCase().includes(q);
  });
  list.sort((a,b)=>{
    if(sort==='trendDesc') return b.change - a.change;
    if(sort==='newest') return b.listedAt - a.listedAt;
    return b.price - a.price;
  });

  // summary
  $('mkCount').textContent = MARKET.length;
  $('mkTop').textContent = yen(Math.max(...MARKET.map(m=>m.price)));
  $('mkAvg').textContent = yen(MARKET.reduce((s,m)=>s+m.price,0)/MARKET.length);
  const avgTrend = MARKET.reduce((s,m)=>s+m.change,0)/MARKET.length;
  const tEl = $('mkTrend'); tEl.textContent = pct(avgTrend);
  tEl.className = 'v ' + (avgTrend>=0?'plus':'minus');

  const grid = $('mkGrid'); grid.innerHTML='';
  list.forEach((m,i)=>{
    const hue = avatarHue(m.seller);
    const up = m.change>=0;
    const el = document.createElement('div');
    el.className='item';
    el.style.cursor='pointer';
    el.innerHTML = `
      <div class="thumb">
        <span class="ph">📕</span>
        <div class="badges">
          ${m.firstEd?'<span class="badge hot">初版</span>':''}
          ${m.obi?'<span class="badge">帯</span>':''}
          ${m.special?'<span class="badge">サイン</span>':''}
        </div>
      </div>
      <div class="body">
        <div class="title"></div>
        <div class="meta"></div>
        ${svgLine(m.hist, 240, 54, {cls:'spark', gid:i})}
        <div class="nums">
          <div>
            <div class="meta">出品価格</div>
            <div class="market">${yen(m.price)}</div>
          </div>
          <div class="trend ${up?'plus':'minus'}">${pct(m.change)}<br><span class="meta">直近12ヶ月</span></div>
        </div>
        <div class="seller"><span class="ava" style="background:hsl(${hue} 50% 30%)">${m.seller[0]}</span>${m.seller}</div>
      </div>`;
    el.querySelector('.title').textContent = m.t;
    el.querySelector('.meta').textContent = [m.a, m.v, 'コンディション'+m.cond].filter(Boolean).join(' ・ ');
    el.onclick = ()=> openMarketDetail(m.id);
    grid.appendChild(el);
  });
}

function switchView(view){

  $('view-collection').style.display = view==='collection' ? '' : 'none';
  $('view-market').style.display = view==='market' ? '' : 'none';
  $('collectionActions').style.display = view==='collection' ? 'flex' : 'none';
  if(view==='market') renderMarket();
}
document.querySelectorAll('.tab').forEach(t=>{
  t.onclick = ()=> switchView(t.dataset.view);
});
