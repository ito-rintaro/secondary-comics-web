openapi: 3.0.3

info:
  title: Secondary Comics API
  version: 0.1.0
  description: |
    二次流通コミックの資産管理アプリのバックエンド API。
    「My コレクション」の取得（GET /collection）、
    「マーケット相場」の取得（GET /market）、
    「カタログ（書誌マスタ）」の取得（GET /catalogs）、
    「コレクションへの追加」（POST /collection）を定義する。
    コレクションの編集・削除（update / delete）は今回スコープ外。

servers:
  - url: https://api.example.com/dev
    description: dev 環境（実際の API Gateway ドメインに差し替える）

# ───────────────────────────────────────────────
# エンドポイント
# ───────────────────────────────────────────────
paths:
  /collection:
    get:
      operationId: listCollection
      summary: ログイン中ユーザーのコレクション一覧を取得
      description: |
        Cognito の JWT に含まれるユーザー識別子（sub）で絞り込み、
        そのユーザーが登録した全アイテムを配列で返す。
        検索・フィルタ・ソート・集計はフロント側で行うため、
        サーバーは生のアイテム配列のみを返す（クエリパラメータなし）。
      tags: [collection]
      security:
        - cognito: []
      responses:
        '200':
          description: コレクションのアイテム配列（0 件なら空配列）
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CollectionItem'
              examples:
                sample:
                  $ref: '#/components/examples/CollectionList'
        '401':
          description: 未認証（トークンが無い／無効）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      operationId: createCollection
      summary: コレクションに 1 件追加
      description: |
        ログイン中ユーザー（JWT の sub）のコレクションへ新規アイテムを 1 件作成する。
        書誌は catalogId で既存の Catalog を参照し、本文には所有インスタンス固有の
        情報だけを入れる（id と updatedAt はサーバが採番）。
        catalogId と condition が必須で、他は既定値で補完する。
      tags: [collection]
      security:
        - cognito: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewCollectionInput'
            examples:
              sample:
                $ref: '#/components/examples/NewCollectionInputSample'
      responses:
        '201':
          description: 作成された CollectionItem（Catalog を合成した enriched 形）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionItem'
        '400':
          description: 入力不正（catalogId 不在 / 必須欠落 / 型不正 / JSON 不正など）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 未認証（トークンが無い／無効）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /market:
    get:
      operationId: listMarket
      summary: マーケット成約ログの一覧を取得
      description: |
        二次流通マーケットの成約レコード（1 件 1 価格）を配列で返す append-only な取引ログ。
        コレクションと異なりユーザー個別ではなく全ユーザー共通（グローバル）の
        データで、sub による絞り込みは行わない。相場（現在価格・変化率・チャート系列）は
        集計した GET /market/summary 側で取得する。並び順（新着等）はフロント側で行うため、
        サーバーは生のレコード配列のみを返す（クエリパラメータなし）。
      tags: [market]
      security:
        - cognito: []
      responses:
        '200':
          description: 成約レコード（MarketSale）の配列（0 件なら空配列）
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MarketSale'
              examples:
                sample:
                  $ref: '#/components/examples/MarketList'
        '401':
          description: 未認証（トークンが無い／無効）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      operationId: createMarket
      summary: マーケット成約を 1 件追加（要 editor 権限）
      description: |
        新規の MarketSale（成約 1 件）を作成する。書誌は catalogId で既存の Catalog を
        参照し、本文には成約固有の情報（condition/price/soldAt/seller）だけを入れる。
        id / listedAt（登録時刻）はサーバが採番する。相場の集計は読み取り側で行う。
        Cognito の "editor" グループに所属するユーザーのみ実行可能（未所属は 403）。
      tags: [market]
      security:
        - cognito: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewMarketInput'
      responses:
        '201':
          description: 作成された MarketSale（Catalog を合成した形）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketSale'
        '400':
          description: 入力不正（catalogId 不在 / price・soldAt が不正 など）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 未認証（トークンが無い／無効）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 権限なし（editor グループ未所属）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /market/summary:
    get:
      operationId: listMarketSummary
      summary: catalog 単位の相場サマリ一覧を取得
      description: |
        成約ログ（GET /market）を catalog 単位に集計した相場サマリを配列で返す。
        現在価格 price・変化率 change・月次に畳んだ擬似系列 history[12] を導出しており、
        相場一覧カードと価格チャートの供給源になる。成約が 1 件以上ある catalog のみ含む。
        全ユーザー共通（グローバル）のデータで、クエリパラメータは取らない。
      tags: [market]
      security:
        - cognito: []
      responses:
        '200':
          description: 相場サマリ（MarketSummary）の配列（0 件なら空配列）
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MarketSummary'
              examples:
                sample:
                  $ref: '#/components/examples/MarketSummaryList'
        '401':
          description: 未認証（トークンが無い／無効）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /market/{id}:
    put:
      operationId: updateMarket
      summary: マーケット成約を更新（要 editor 権限）
      description: |
        既存の MarketSale（成約）を更新する。可変項目（catalogId/condition/price/soldAt/seller）
        を置き換える。listedAt（登録時刻）は保持される。
        "editor" グループ所属が必須（未所属は 403）。
      tags: [market]
      security:
        - cognito: []
      parameters:
        - name: id
          in: path
          required: true
          description: 対象 MarketSale の id
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewMarketInput'
      responses:
        '200':
          description: 更新後の MarketSale
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketSale'
        '400':
          description: 入力不正（catalogId 不在 / price・soldAt が不正 など）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 未認証（トークンが無い／無効）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 権限なし（editor グループ未所属）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 指定 id の MarketSale が存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deleteMarket
      summary: マーケット相場を削除（要 editor 権限）
      description: |
        指定 id の MarketSale を削除する。"editor" グループ所属が必須（未所属は 403）。
      tags: [market]
      security:
        - cognito: []
      parameters:
        - name: id
          in: path
          required: true
          description: 対象 MarketSale の id
          schema:
            type: string
      responses:
        '204':
          description: 削除成功（本文なし）
        '401':
          description: 未認証（トークンが無い／無効）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 権限なし（editor グループ未所属）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 指定 id の MarketSale が存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /catalogs:
    get:
      operationId: listCatalogs
      summary: カタログ（書誌マスタ）の一覧を取得
      description: |
        Collection / MarketSale が catalogId で参照する書誌マスタ（Catalog）を
        配列で返す。マーケット同様、全ユーザー共通（グローバル）のデータで、
        sub による絞り込みは行わない。全件が単一パーティション（PK="CATALOG"）に
        束ねられており、Query 1 回で取得する（クエリパラメータなし）。
      tags: [catalog]
      security:
        - cognito: []
      responses:
        '200':
          description: カタログの配列（0 件なら空配列）
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Catalog'
              examples:
                sample:
                  $ref: '#/components/examples/CatalogList'
        '401':
          description: 未認証（トークンが無い／無効）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      operationId: createCatalog
      summary: カタログ（書誌マスタ）を 1 件追加（要 editor 権限）
      description: |
        新規の Catalog を 1 件作成する。id はサーバが採番する（cat-xxx）。
        title のみ必須で、他は既定値で補完する。
        Cognito の "editor" グループに所属するユーザーのみ実行可能（未所属は 403）。
      tags: [catalog]
      security:
        - cognito: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewCatalogInput'
      responses:
        '201':
          description: 作成された Catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Catalog'
        '400':
          description: 入力不正（title 欠落 / 型不正 / JSON 不正など）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 未認証（トークンが無い／無効）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 権限なし（editor グループ未所属）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /catalogs/{id}:
    put:
      operationId: updateCatalog
      summary: カタログを更新（要 editor 権限）
      description: |
        既存の Catalog を丸ごと更新する。title のみ必須で、他は既定値で補完する。
        "editor" グループ所属が必須（未所属は 403）。
      tags: [catalog]
      security:
        - cognito: []
      parameters:
        - name: id
          in: path
          required: true
          description: 対象 Catalog の id
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewCatalogInput'
      responses:
        '200':
          description: 更新後の Catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Catalog'
        '400':
          description: 入力不正（title 欠落 / 型不正 / JSON 不正など）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 未認証（トークンが無い／無効）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 権限なし（editor グループ未所属）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 指定 id の Catalog が存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deleteCatalog
      summary: カタログを削除（要 editor 権限）
      description: |
        指定 id の Catalog を削除する。"editor" グループ所属が必須（未所属は 403）。
        参照している Collection / MarketSale がある場合の整合はフロント運用で担保する。
      tags: [catalog]
      security:
        - cognito: []
      parameters:
        - name: id
          in: path
          required: true
          description: 対象 Catalog の id
          schema:
            type: string
      responses:
        '204':
          description: 削除成功（本文なし）
        '401':
          description: 未認証（トークンが無い／無効）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 権限なし（editor グループ未所属）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 指定 id の Catalog が存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /uploads:
    post:
      operationId: createUploadUrl
      summary: 画像アップロード用の署名付き PUT URL を発行（要 editor 権限）
      description: |
        カタログ画像を S3 の images/ 配下に直接アップロードするための署名付き URL を返す。
        オブジェクトキーはサーバが採番する（クライアントのファイル名は使わない）。
        ブラウザは返却された uploadUrl に、署名時と同じ Content-Type を付けて画像バイトを
        PUT する（PUT には認証ヘッダを付けない）。保存すべき imageUrl は返却の key。
        "editor" グループ所属が必須（未所属は 403）。
      tags: [upload]
      security:
        - cognito: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewUploadInput'
      responses:
        '200':
          description: 署名付き PUT URL と、保存すべき imageUrl キー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadTicket'
        '400':
          description: contentType 不正 / 未対応の型
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 未認証（トークンが無い／無効）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 権限なし（editor グループ未所属）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

# ───────────────────────────────────────────────
# 再利用部品
# ───────────────────────────────────────────────
components:
  securitySchemes:
    cognito:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Amazon Cognito が発行する JWT を Authorization: Bearer <token> で送る。
        userId はサーバー側でトークンの sub から取得するため、
        リクエストには userId を含めない（他人のデータを指定できないようにする）。

  schemas:
    # コレクションの所有品 1 件。フロントの domain/collection/CollectionItem.ts と一致させる。
    CollectionItem:
      type: object
      required:
        - id
        - title
        - author
        - publisher
        - volume
        - year
        - condition
        - qty
        - cost
        - market
        - marketSource
        - flags
        - purchaseDate
        - store
        - location
        - memo
        - imageUrl
        - updatedAt
      properties:
        id:
          type: string
          description: アイテム識別子（システム生成）
          example: seed0
        title:
          type: string
          description: 作品名
          example: AKIRA 全6巻 初版帯付セット
        author:
          type: string
          description: 著者
          example: 大友克洋
        publisher:
          type: string
          description: 出版社 / レーベル
          example: 講談社 / KCデラックス
        volume:
          type: string
          description: 巻数（"全6巻" "第1巻" 等の自由文字列）
          example: 全6巻
        year:
          type: string
          description: 発行年（文字列）
          example: '1984'
        condition:
          $ref: '#/components/schemas/Condition'
        qty:
          type: integer
          minimum: 1
          description: 所有数
          example: 1
        cost:
          type: integer
          minimum: 0
          description: 取得価格（1 点あたり・円）
          example: 8000
        market:
          type: integer
          minimum: 0
          description: |
            現在相場（1 点あたり・円）。サーバが catalogId のマーケット相場から
            算出して載せる（コレクションには保存しない）。相場が無ければ 0。
          example: 35000
        marketSource:
          $ref: '#/components/schemas/MarketSource'
        flags:
          $ref: '#/components/schemas/ConditionFlags'
        purchaseDate:
          type: string
          description: 購入日（YYYY-MM-DD。未入力は空文字）
          example: ''
        store:
          type: string
          description: 購入店
          example: まんだらけ
        location:
          type: string
          description: 保管場所
          example: 本棚A
        memo:
          type: string
          description: メモ（自由記述）
          example: 初版・帯揃い。背ヤケ少なめ。
        imageUrl:
          type: string
          description: |
            画像の S3 オブジェクトキー（ファイル名のみ。例: "xxx.jpg"）。
            実体は CloudFront 配下の images/ に置かれ、フロントが
            CloudFront ドメイン + "/images/" を前置して表示する。空文字可。
          example: 619333a5ab646_991428d170c6d9fab761e61feeffbd6b.jpg
        updatedAt:
          type: integer
          format: int64
          description: 最終更新時刻（epoch ミリ秒）
          example: 1718000000000

    # POST /collection のリクエストボディ。id / updatedAt はサーバ採番、
    # market / marketSource はマーケットから導出するため含めない。
    # catalogId と condition のみ必須、他は既定値で補完する。
    NewCollectionInput:
      type: object
      required: [catalogId, condition]
      properties:
        catalogId:
          type: string
          description: 参照する Catalog の id（実在必須。無ければ 400）
          example: cat-001
        condition:
          $ref: '#/components/schemas/Condition'
        qty:
          type: integer
          minimum: 1
          default: 1
          description: 所有数（既定 1）
          example: 1
        cost:
          type: integer
          minimum: 0
          default: 0
          description: 取得価格（1 点あたり・円。既定 0）
          example: 8000
        purchaseDate:
          type: string
          default: ''
          description: 購入日（YYYY-MM-DD。既定 空文字）
          example: '2025-12-01'
        store:
          type: string
          default: ''
          example: まんだらけ
        location:
          type: string
          default: ''
          example: 本棚A
        memo:
          type: string
          default: ''
          example: 初版・帯揃い。背ヤケ少なめ。

    # 状態ランク。domain/shared/Condition.ts と一致。
    Condition:
      type: string
      enum: [S, A, B, C]
      description: |
        S=新品・美品 / A=良い / B=並 / C=傷み・難あり

    # 相場の出所。domain/collection/CollectionItem.ts の MarketSource と一致。
    MarketSource:
      type: string
      enum: [manual, auto, estimate]
      description: |
        相場の出所。manual=手入力 / auto=自動取得 / estimate=推定。
        Collection では相場あり→auto、相場なし→estimate をサーバが自動設定する。

    # 付帯状態フラグ。domain/collection/ConditionFlags.ts と一致。
    ConditionFlags:
      type: object
      required: [firstEd, obi, special]
      properties:
        firstEd:
          type: boolean
          description: 初版かどうか
        obi:
          type: boolean
          description: 帯付きかどうか
        special:
          type: boolean
          description: 特装・サイン等の特別仕様かどうか

    # マーケットの成約レコード 1 件（1 件 1 価格の取引ログ）。
    # フロントの domain/market/MarketSale.ts と一致させる。
    MarketSale:
      type: object
      required:
        - id
        - title
        - author
        - publisher
        - volume
        - flags
        - imageUrl
        - catalogId
        - condition
        - price
        - soldAt
        - seller
      properties:
        id:
          type: string
          description: レコード識別子（システム生成。mk-xxx）
          example: mk-8f3c1e2a
        title:
          type: string
          description: 作品名（Catalog 由来）
          example: AKIRA 全6巻 初版帯付 美品セット
        author:
          type: string
          description: 著者（Catalog 由来）
          example: 大友克洋
        publisher:
          type: string
          description: 出版社 / レーベル（Catalog 由来）
          example: 講談社
        volume:
          type: string
          description: 巻数（Catalog 由来。"全6巻" "第1巻" 等の自由文字列）
          example: 全6巻
        flags:
          $ref: '#/components/schemas/ConditionFlags'
        imageUrl:
          type: string
          description: |
            画像の S3 オブジェクトキー（Catalog 由来。ファイル名のみ。例: "xxx.jpg"）。
            実体は CloudFront 配下の images/ に置かれ、フロントが
            CloudFront ドメイン + "/images/" を前置して表示する。空文字可。
          example: 619333a5ab646_991428d170c6d9fab761e61feeffbd6b.jpg
        catalogId:
          type: string
          description: 参照する Catalog の id
          example: cat-001
        condition:
          $ref: '#/components/schemas/Condition'
        price:
          type: integer
          minimum: 0
          description: 成約価格（円）＝単一。
          example: 35400
        soldAt:
          type: string
          format: date
          description: 成約日（"YYYY-MM-DD"）。集計・チャートの時間軸。
          example: '2026-07-05'
        seller:
          type: string
          description: 販売元 / ショップ名（空文字可）
          example: コレクター田中

    # catalog 単位の相場サマリ。成約ログ（MarketSale）を集計した読み取りモデル。
    # フロントの相場一覧カード・価格チャートが消費する。price/change/history は導出値。
    MarketSummary:
      type: object
      required:
        - catalogId
        - title
        - author
        - publisher
        - volume
        - flags
        - imageUrl
        - price
        - change
        - history
        - sampleCount
        - lastSoldAt
      properties:
        catalogId:
          type: string
          description: 集計単位＝参照する Catalog の id
          example: cat-001
        title:
          type: string
          example: AKIRA 全6巻 初版帯付 美品セット
        author:
          type: string
          example: 大友克洋
        publisher:
          type: string
          example: 講談社
        volume:
          type: string
          example: 全6巻
        flags:
          $ref: '#/components/schemas/ConditionFlags'
        imageUrl:
          type: string
          description: 画像の S3 オブジェクトキー（Catalog 由来。ファイル名のみ。空文字可）。
          example: 619333a5ab646_991428d170c6d9fab761e61feeffbd6b.jpg
        price:
          type: integer
          minimum: 0
          description: 現在価格（円）＝ history 末尾（直近月バケット）。
          example: 35400
        change:
          type: number
          format: float
          description: 期間変化率 (history 末尾 - 先頭) / 先頭。0.18 なら +18%。
          example: 0.18
        history:
          type: array
          description: |
            月次に畳んだ擬似価格系列（円）。要素数 12・末尾＝当月。
            成約が無い月は直前月をキャリー（前方フィル）、最初の成約より前は
            最初の非空値でバックフィルする（成約が疎でも折れ線を成立させるため）。
          items:
            type: integer
            minimum: 0
          minItems: 12
          maxItems: 12
          example: [30000, 30500, 31000, 31800, 32500, 33000, 33600, 34200, 34800, 35100, 35400, 35400]
        sampleCount:
          type: integer
          minimum: 0
          description: 集計に使った成約点数（相場の信頼度の目安）。
          example: 7
        lastSoldAt:
          type: string
          format: date
          description: 直近成約日（"YYYY-MM-DD"）。
          example: '2026-07-05'

    # 書誌マスタ（Catalog）1 件。Collection / MarketSale が catalogId で参照する hub。
    # フロントの domain/catalog/Catalog.ts と一致させる。
    Catalog:
      type: object
      required:
        - id
        - title
        - author
        - publisher
        - volume
        - year
        - flags
        - imageUrl
      properties:
        id:
          type: string
          description: カタログ識別子（システム生成。cat-xxx）
          example: cat-001
        title:
          type: string
          description: 作品名
          example: AKIRA 全6巻 初版帯付セット
        author:
          type: string
          description: 著者
          example: 大友克洋
        publisher:
          type: string
          description: 出版社 / レーベル
          example: 講談社 / KCデラックス
        volume:
          type: string
          description: 巻数（"全6巻" "第1巻" 等の自由文字列）
          example: 全6巻
        year:
          type: string
          description: 発行年（文字列）
          example: '1984'
        flags:
          $ref: '#/components/schemas/ConditionFlags'
        imageUrl:
          type: string
          description: |
            画像の S3 オブジェクトキー（ファイル名のみ。例: "xxx.jpg"）。
            実体は CloudFront 配下の images/ に置かれ、フロントが
            CloudFront ドメイン + "/images/" を前置して表示する。空文字可。
          example: 619333a5ab646_991428d170c6d9fab761e61feeffbd6b.jpg

    # POST /market・PUT /market/{id} のリクエストボディ（成約 1 件）。
    # 書誌は catalogId で参照し、成約固有情報だけを持つ。
    # id / listedAt はサーバ採番のため含めない。相場（history/change）は集計側で導出。
    NewMarketInput:
      type: object
      required: [catalogId, condition, price, soldAt]
      properties:
        catalogId:
          type: string
          description: 参照する Catalog の id（実在必須。無ければ 400）
          example: cat-001
        condition:
          $ref: '#/components/schemas/Condition'
        price:
          type: integer
          minimum: 0
          description: 成約価格（円・0 以上の整数）
          example: 35400
        soldAt:
          type: string
          format: date
          description: 成約日（"YYYY-MM-DD"。実在する暦日）
          example: '2026-07-05'
        seller:
          type: string
          default: ''
          description: 販売元 / ショップ名（既定 空文字）
          example: コレクター田中

    # POST /catalogs・PUT /catalogs/{id} のリクエストボディ。
    # id はサーバ採番（cat-xxx）のため含めない。title のみ必須、他は既定値で補完する。
    NewCatalogInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
          example: AKIRA 全6巻 初版帯付セット
        author:
          type: string
          default: ''
          example: 大友克洋
        publisher:
          type: string
          default: ''
          example: 講談社 / KCデラックス
        volume:
          type: string
          default: ''
          example: 全6巻
        year:
          type: string
          default: ''
          example: '1984'
        flags:
          $ref: '#/components/schemas/ConditionFlags'
        imageUrl:
          type: string
          default: ''
          description: 画像の S3 オブジェクトキー（ファイル名のみ。空文字可）。
          example: 619333a5ab646_991428d170c6d9fab761e61feeffbd6b.jpg

    # POST /uploads のリクエストボディ。アップロードするファイルの MIME タイプを申告する。
    # 実バイトの検証まではしないため、SVG/HTML を避けラスタ形式のみを許可する。
    NewUploadInput:
      type: object
      required: [contentType]
      properties:
        contentType:
          type: string
          enum: [image/jpeg, image/png, image/webp]
          description: アップロードするファイルの MIME タイプ
          example: image/jpeg

    # POST /uploads の応答。key を imageUrl に保存し、uploadUrl へ画像バイトを PUT する。
    UploadTicket:
      type: object
      required: [key, uploadUrl, expiresIn]
      properties:
        key:
          type: string
          description: 保存すべき imageUrl（images/ を除いたファイル名のみ）
          example: 8f3c1e2a-7b4d-4c2e-9a1f-0b2c3d4e5f60.jpg
        uploadUrl:
          type: string
          description: この URL に画像バイトを PUT する（Content-Type を署名時と一致させる）
        expiresIn:
          type: integer
          description: URL の有効秒数
          example: 300

    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: Unauthorized

